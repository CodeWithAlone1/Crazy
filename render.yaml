services:
  - type: web
    name: shein-voucher-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: MAX_WORKERS
        value: 100
      - key: REQUEST_TIMEOUT
        value: 8
      - key: BATCH_SIZE
        value: 50
      - key: AUTO_START
        value: "true"
      - key: LOG_LEVEL
        value: INFO
